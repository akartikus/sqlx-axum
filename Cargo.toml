[package]
name = "ticket-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"

dotenvy = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "time"
] }

thiserror = "2"

time = { version = "0.3", features = ["serde"] }

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal"
] }

tower-http = { version = "0.6", features = ["trace"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
